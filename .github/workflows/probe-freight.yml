name: Sondagem do frete (temporária)
on:
  push:
    branches: [claude/admiring-cerf-7sq5qw]
    paths: [cotacoes/scripts/probe-freight.mjs, .github/workflows/probe-freight.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node cotacoes/scripts/probe-freight.mjs
