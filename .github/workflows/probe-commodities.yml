name: Sondagem commodities (temporária)
on:
  push:
    branches: [claude/admiring-cerf-7sq5qw]
    paths: ['cotacoes/scripts/probe-commodities.mjs', '.github/workflows/probe-commodities.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node cotacoes/scripts/probe-commodities.mjs
