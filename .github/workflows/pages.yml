name: Deploy cotacoes (GitHub Pages)

on:
  push:
    branches: [main, claude/obsidian-plugin-analysis-bagjz3]
    paths: ['cotacoes/**']
  schedule:
    - cron: '17 * * * *' # notícias: atualização de hora em hora
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: cotacoes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cotacoes/package-lock.json
      - run: npm ci
      - name: Coletar notícias
        run: node scripts/fetch-news.mjs
        env:
          NEWS_STRICT: ${{ github.event_name == 'schedule' }}
      - name: Coletar dados do Banco Central (CDI, Selic, Focus, PTAX)
        run: node scripts/fetch-macro.mjs
        timeout-minutes: 15
        env:
          MACRO_STRICT: ${{ github.event_name == 'schedule' }}
      - name: Coletar intraday (barras de 5 min)
        run: node scripts/fetch-intraday.mjs
        env:
          INTRADAY_STRICT: ${{ github.event_name == 'schedule' }}
      - name: Coletar curvas de juros (DI x pré e Treasuries)
        run: node scripts/fetch-curves.mjs
        env:
          CURVES_STRICT: ${{ github.event_name == 'schedule' }}
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: cotacoes/dist
      - id: deployment
        uses: actions/deploy-pages@v4
