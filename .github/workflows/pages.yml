name: Deploy cotacoes e financas (GitHub Pages)

on:
  push:
    branches: [main, claude/obsidian-plugin-analysis-bagjz3]
    paths: ['cotacoes/**', 'financas/**', '.github/workflows/pages.yml']
  schedule:
    # Só de segunda a sexta no horário de Brasília (UTC-3): segunda 00h a sexta 23h. Sem coleta no sábado e no domingo.
    - cron: '17 3-23 * * 1-5' # segunda a sexta, 0h a 20h de Brasília
    - cron: '17 0-2 * * 2-6' # terça a sábado UTC = segunda a sexta, 21h a 23h de Brasília
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: cotacoes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            cotacoes/package-lock.json
            financas/package-lock.json
      - run: npm ci
      - name: Testes (parsers e lógica)
        run: npm test
      - name: Coletar notícias
        run: node scripts/fetch-news.mjs
        env:
          NEWS_STRICT: ${{ github.event_name == 'schedule' }}
      - name: Coletar dados do Banco Central (CDI, Selic, Focus, PTAX)
        run: node scripts/fetch-macro.mjs
        timeout-minutes: 15
        env:
          MACRO_STRICT: ${{ github.event_name == 'schedule' }}
      - name: Coletar curvas de juros (DI x pré e Treasuries)
        run: node scripts/fetch-curves.mjs
        env:
          CURVES_STRICT: ${{ github.event_name == 'schedule' }}
      - name: Coletar feriados da China (dados oficiais)
        run: node scripts/fetch-holidays.mjs
        continue-on-error: true
      - name: Verificar dados desatualizados
        run: node scripts/check-stale.mjs
        continue-on-error: true
      - name: Build
        run: npm run build
        env:
          VITE_DATA_BASE: https://raw.githubusercontent.com/${{ github.repository }}/data
      - name: App de finanças (testes, build e junção em /financas)
        run: |
          cd ../financas
          npm ci
          npm test
          npm run build
          cd ../cotacoes
          mkdir -p dist/financas
          cp -R ../financas/dist/. dist/financas/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: cotacoes/dist
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Avisar falha do deploy (issue + Teams, se configurado)
        if: failure()
        uses: actions/github-script@v7
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const title = 'Deploy da página de cotações falhou'
            const body = `A atualização automática falhou e a página continua com os dados anteriores.\n\nExecução: ${run}\nGatilho: ${context.eventName}`
            const open = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', per_page: 50 })
            const prev = open.data.find((i) => i.title === title && !i.pull_request)
            if (prev) await github.rest.issues.createComment({ ...context.repo, issue_number: prev.number, body })
            else await github.rest.issues.create({ ...context.repo, title, body })
            if (process.env.TEAMS_WEBHOOK_URL) {
              await fetch(process.env.TEAMS_WEBHOOK_URL, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ text: `${title}: ${run}` }) }).catch(() => {})
            }
      - name: Alertar dados desatualizados há mais de 6 horas (issue + Teams, se configurado)
        if: always()
        uses: actions/github-script@v7
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        with:
          script: |
            const fs = require('fs')
            const file = `${process.env.RUNNER_TEMP}/stale.json`
            if (!fs.existsSync(file)) return
            const { hours, items } = JSON.parse(fs.readFileSync(file, 'utf8'))
            const title = `Dados da página de cotações desatualizados há mais de ${hours} horas`
            const open = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', per_page: 50 })
            const prev = open.data.find((i) => i.title === title && !i.pull_request)
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            if (items.length) {
              const list = items.map((i) => `- ${i.label}: ${i.hours == null ? 'data da coleta desconhecida' : `${i.hours} h sem atualizar`}`).join('\n')
              const body = `A fonte destes dados está fora do ar e a página mostra o último dado publicado:\n\n${list}\n\nExecução: ${run}`
              if (prev) await github.rest.issues.createComment({ ...context.repo, issue_number: prev.number, body })
              else {
                await github.rest.issues.create({ ...context.repo, title, body })
                if (process.env.TEAMS_WEBHOOK_URL) await fetch(process.env.TEAMS_WEBHOOK_URL, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ text: `${title}: ${items.map((i) => i.label).join(', ')}. ${run}` }) }).catch(() => {})
              }
            } else if (prev) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: prev.number, body: `Normalizado: nenhum bloco desatualizado há mais de ${hours} horas.\n\nExecução: ${run}` })
              await github.rest.issues.update({ ...context.repo, issue_number: prev.number, state: 'closed', state_reason: 'completed' })
            }
