name: Cotações (coleta central)

# Um único robô consulta a AwesomeAPI e publica quotes.json, intraday.json e history.json na branch `data`.
# Todos os usuários leem esses arquivos: a cota da API não depende de quantas pessoas abrem a página.
on:
  schedule:
    # Horário de Brasília = UTC-3. A cada 5 min das 9h30 às 18h, de segunda a sexta (12h30 às 21h00 UTC).
    - cron: '30-55/5 12 * * 1-5'
    - cron: '*/5 13-20 * * 1-5'
    - cron: '0 21 * * 1-5'
    # Fora dessa janela, 1 vez por hora, só de segunda a sexta: 0h07 às 9h07 e 18h07 às 23h07 de Brasília. Nada no sábado e no domingo.
    - cron: '7 3-12 * * 1-5'
    - cron: '7 21-23 * * 1-5'
    - cron: '7 0-2 * * 2-6'
  workflow_dispatch:

concurrency:
  group: quotes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Baixar os dados anteriores (branch data)
        run: |
          mkdir -p /tmp/data
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data
            for f in quotes.json intraday.json history.json; do git show FETCH_HEAD:$f > /tmp/data/$f 2>/dev/null || true; done
          fi
      - name: Coletar
        run: node cotacoes/scripts/fetch-quotes.mjs
        env:
          DATA_DIR: /tmp/data
          AWESOMEAPI_KEY: ${{ secrets.AWESOMEAPI_KEY }}
      - name: Publicar na branch data
        run: |
          cd /tmp/data
          [ -f quotes.json ] || { echo "nada a publicar"; exit 0; }
          git init -q
          git checkout -q -b data
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -q -m "cotações $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
