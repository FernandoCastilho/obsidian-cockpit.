name: Cotações CI
on:
  pull_request:
    paths: ['cotacoes/**', '.github/workflows/cotacoes-ci.yml']
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cotacoes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cotacoes/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Preparar ensaio semanal com dados simulados
        run: node test/helpers/weekly-package.mjs "$RUNNER_TEMP/weekly-package-test.json"
      - run: npm run build
      - name: Conferir preservação no build real
        run: node scripts/weekly-data.mjs dist "$RUNNER_TEMP/weekly-package-test.json"
  smoke:
    runs-on: ubuntu-latest
    needs: test-build
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cotacoes
    env:
      SMOKE_BASE_URL: http://127.0.0.1:8768
      SMOKE_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cotacoes/package-lock.json
      - run: npm ci
      - name: Build com os dados na própria origem
        run: VITE_DATA_BASE=http://127.0.0.1:8768 npm run build
      - name: Instalar Playwright e Chromium
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Servir o build
        run: |
          nohup python3 -m http.server 8768 --bind 127.0.0.1 --directory dist > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8768/ > /dev/null && break; sleep 1; done
      - name: Conferir largura, ajudas e fluxos das seis calculadoras
        run: CALCULATOR_QA_OUTPUT="$RUNNER_TEMP/qa-universal/calculators" node scripts/smoke-calculator-layout.cjs
      - name: Capturas da revisão das calculadoras
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calculadoras-design
          path: ${{ runner.temp }}/qa-universal/calculators
          if-no-files-found: ignore
          retention-days: 7
      - name: Smokes de navegador (abas, mercado, calendário e controles de 44 px)
        run: |
          for s in smoke-ui smoke-market-table smoke-data-health smoke-market-workspace smoke-market-followup smoke-ux smoke-chart-compare smoke-outros smoke-date-range smoke-cupom smoke-calendario smoke-global-search smoke-recuperacao smoke-heavy-vehicles smoke-setores-navigation smoke-dynamic-notifications smoke-calculadora smoke-finimp smoke-finimp-help smoke-bndes smoke-recado smoke-conceito-diario smoke-motion smoke-alerta smoke-apresentacao; do
            echo "::group::$s"
            FINIMP_HELP_QA_OUTPUT="$RUNNER_TEMP/qa-universal/finimp-help" SETORES_QA_OUTPUT="$RUNNER_TEMP/qa-universal/setores" SEARCH_QA_OUTPUT="$RUNNER_TEMP/qa-universal" CONCEITO_QA_OUTPUT="$RUNNER_TEMP/qa-c" UX_QA_OUTPUT="$RUNNER_TEMP/qa-ux" TABLE_QA_OUTPUT="$RUNNER_TEMP/qa-t" WORKSPACE_QA_OUTPUT="$RUNNER_TEMP/qa-w" FOLLOWUP_QA_OUTPUT="$RUNNER_TEMP/qa-f" node scripts/$s.cjs
            echo "::endgroup::"
          done
      - name: Seleção temporal com mouse e toque nos componentes
        run: |
          npm run dev -- --host 127.0.0.1 --port 8770 > "$RUNNER_TEMP/comparison-vite.log" 2>&1 &
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8770/test/fixtures/chart-comparison.html > /dev/null && break; sleep 1; done
          SMOKE_BASE_URL=http://127.0.0.1:8770 COMPARISON_QA_OUTPUT="$RUNNER_TEMP/qa-universal" node scripts/smoke-chart-comparison.cjs
      - name: Capturas de tela dos smokes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-capturas
          path: |
            ${{ runner.temp }}/qa-ux
            ${{ runner.temp }}/qa-t
            ${{ runner.temp }}/qa-w
            ${{ runner.temp }}/qa-f
            ${{ runner.temp }}/qa-c
            ${{ runner.temp }}/qa-universal
          if-no-files-found: ignore
          retention-days: 7
