name: Cotações CI
on:
  pull_request:
    paths: ['cotacoes/**', 'caixa/**', '.github/workflows/cotacoes-ci.yml']
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cotacoes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            cotacoes/package-lock.json
            caixa/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: App Caixa (testes e build, como no deploy)
        working-directory: caixa
        run: |
          npm ci
          npm test
          npm run build
  smoke:
    runs-on: ubuntu-latest
    needs: test-build
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cotacoes
    env:
      SMOKE_BASE_URL: http://127.0.0.1:8768
      SMOKE_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cotacoes/package-lock.json
      - run: npm ci
      - name: Build com os dados na própria origem
        run: VITE_DATA_BASE=http://127.0.0.1:8768 npm run build
      - name: Instalar Playwright e Chromium
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Servir o build
        run: |
          nohup python3 -m http.server 8768 --bind 127.0.0.1 --directory dist > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8768/ > /dev/null && break; sleep 1; done
      - name: Smokes de navegador (abas, mercado, calendário e controles de 44 px)
        run: |
          for s in smoke-ui smoke-market-table smoke-market-workspace smoke-market-followup smoke-ux smoke-chart-compare smoke-outros; do
            echo "::group::$s"
            UX_QA_OUTPUT="$RUNNER_TEMP/qa-ux" TABLE_QA_OUTPUT="$RUNNER_TEMP/qa-t" WORKSPACE_QA_OUTPUT="$RUNNER_TEMP/qa-w" FOLLOWUP_QA_OUTPUT="$RUNNER_TEMP/qa-f" node scripts/$s.cjs
            echo "::endgroup::"
          done
