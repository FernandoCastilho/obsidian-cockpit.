name: Diagnóstico B3 (temporário)
on:
  push:
    branches: [claude/admiring-cerf-7sq5qw]
    paths: ['cotacoes/scripts/diag-b3.mjs', '.github/workflows/b3-diag.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cotacoes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/diag-b3.mjs
