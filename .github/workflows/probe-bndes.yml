name: Sondagem BNDES (temporária)
on:
  workflow_dispatch:
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Base legal do IOF e prática de mercado
        run: |
          pip -q install html2text >/dev/null 2>&1 || true
          sudo apt-get -qq install -y poppler-utils >/dev/null 2>&1 || true
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36'
          for u in "https://www2.camara.leg.br/legin/fed/decret/2007/decreto-6306-14-dezembro-2007-566561-normaatualizada-pe.html" "http://www.planalto.gov.br/ccivil_03/_ato2007-2010/2007/decreto/d6306.htm" "https://static.portaldaindustria.com.br/media/filer_public/52/f1/52f1e555-9795-443f-909b-1d13b0a2c79d/e-book_nac_bndes__finamemateriais_14072025_vf.pdf" "https://informaq.abimaq.org.br/bndes-anuncia-mudancas-nas-condicoes-do-finame-materiais/" "https://www.inspiramais.com.br/pdf/200323_BNDES%20Finame%20Materiais.pdf" "https://observatoriodaindustriars.org.br/solucao/bndes-finame-materiais/" "https://www.bndes.gov.br/wps/portal/site/home/financiamento/guia/perguntas-frequentes"; do
            echo; echo "################ $u"; curl -sSL -m 60 -A "$UA" -H 'Accept: text/html,application/pdf,*/*' -H 'Accept-Language: pt-BR,pt;q=0.9' -o /tmp/p.html -w 'HTTP %{http_code} bytes %{size_download}\n' "$u" || true
            [ -s /tmp/p.html ] && python3 cotacoes/scripts/sonda/iof.py "$u" /tmp/p.html || true
          done
