name: Verificação do site publicado (temporária)
on:
  push:
    branches: [claude/admiring-cerf-7sq5qw]
    paths: ['cotacoes/scripts/probe-site.cjs', '.github/workflows/probe-site.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cotacoes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - run: node scripts/probe-site.cjs
