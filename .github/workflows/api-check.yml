name: Checagem temporária de fontes (SOFR futura)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Páginas públicas com curva forward de SOFR
        run: |
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36'
          g() { echo; echo "=== $1"; curl -sSL -m 40 -A "$UA" -o /tmp/p.html -w "-> %{http_code} %{content_type} %{size_download}B\n" "$1"; }
          g "https://www.pensford.com/resources/forward-curves"
          grep -oiE "(https?:)?//[a-z0-9./_?=&%:-]*(\.csv|\.json|\.xlsx?|forward|curve|sofr)[a-z0-9./_?=&%:-]*" /tmp/p.html | sort -u | head -25
          sed 's/<[^>]*>/ /g' /tmp/p.html | tr -s ' \n' | grep -iE "SOFR|forward|as of|[0-9]\.[0-9]{2,}" | head -20
          g "https://www.bluegamma.io/sofr-forward-curve"
          sed 's/<[^>]*>/ /g' /tmp/p.html | tr -s ' \n' | grep -iE "SOFR|forward|as of|[0-9]\.[0-9]{2}%" | head -25
          grep -oiE "(https?:)?//[a-z0-9./_?=&%:-]*(api|json|csv)[a-z0-9./_?=&%:-]*" /tmp/p.html | sort -u | head -15
          g "https://www.chathamfinancial.com/technology/us-market-rates"
          sed 's/<[^>]*>/ /g' /tmp/p.html | tr -s ' \n' | grep -iE "SOFR|forward|as of" | head -15
          g "https://www.barchart.com/futures/quotes/SQ*0/futures-prices"
          sed 's/<[^>]*>/ /g' /tmp/p.html | tr -s ' \n' | grep -iE "SQ[HMUZ][0-9]{2}|SOFR" | head -15
          g "https://www.cmegroup.com/markets/interest-rates/stirs/three-month-sofr.settlements.html"
          sed 's/<[^>]*>/ /g' /tmp/p.html | tr -s ' \n' | head -c 400
