name: Checagem temporária de fontes (B3)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Curva DI na B3 (dados por produto)
        run: |
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36'
          H=https://sistemaswebb3-derivativos.b3.com.br/referenceRatesProxy/Search
          b() { printf '%s' "$1" | base64 -w0; }
          g() { curl -sSL -m 30 -A "$UA" "$H/$1/$(b "$2")"; }
          echo "== produtos"
          g GetProducts '{"language":"pt-br"}' | tee /tmp/p.json | grep -oE '"id":"[^"]+","description":"[^"]+"'
          for id in $(grep -oE '"id":"[^"]+"' /tmp/p.json | cut -d'"' -f4 | head -30); do
            echo "== $id"
            dates=$(g GetDate "{\"language\":\"pt-br\",\"id\":\"$id\"}")
            echo "datas: $(echo "$dates" | head -c 120)"
            d=$(echo "$dates" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1)
            g GetList "{\"language\":\"pt-br\",\"id\":\"$id\",\"pageNumber\":1,\"pageSize\":4,\"date\":\"$d\"}" | head -c 450; echo
          done
