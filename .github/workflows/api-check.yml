name: Checagem temporária da API de cotações

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Intraday da AwesomeAPI e alternativas
        continue-on-error: true
        run: |
          T=$(date +%Y%m%d)
          show() {
            echo "== $1"
            for i in 1 2 3; do
              code=$(curl -sS -m 25 -D /tmp/h.txt -o /tmp/r.json -w '%{http_code}' -H 'user-agent: Mozilla/5.0' "$1" || echo 000)
              echo "tentativa $i: HTTP $code"
              [ "$code" = "200" ] && break
              sleep 6
            done
            grep -i 'access-control-allow-origin' /tmp/h.txt || echo "(sem CORS)"
            head -c 420 /tmp/r.json | tr '\n' ' '; echo
            jq -r 'if type=="array" then "itens: \(length)" else "chaves: \(keys|join(","))" end' /tmp/r.json 2>/dev/null || true
            jq -r 'if type=="array" and length>1 then "primeiro/último timestamp: \(.[0].timestamp // .[0].create_date) / \(.[-1].timestamp // .[-1].create_date)" else empty end' /tmp/r.json 2>/dev/null || true
          }
          B=https://economia.awesomeapi.com.br/json
          show "$B/USD-BRL/10"
          show "$B/USD-BRL/360"
          show "$B/USD-BRL/360?start_date=$T&end_date=$T"
          show "$B/daily/USD-BRL/3"
          show "https://query1.finance.yahoo.com/v8/finance/chart/USDBRL=X?interval=5m&range=1d"
