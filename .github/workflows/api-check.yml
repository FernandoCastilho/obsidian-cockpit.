name: Checagem temporária de fontes (Debit)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Debit.com.br indicadores
        run: |
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36'
          g() { echo; echo "=== $1"; curl -sSL -m 40 -A "$UA" -H 'Accept-Language: pt-BR,pt;q=0.9' -o /tmp/p.html -w "-> %{http_code} %{url_effective} %{size_download}B\n" "$1"; }
          g "https://share.google/gohcMoCoAaSIh9aqo"
          sed 's/<[^>]*>/ /g' /tmp/p.html | tr -s ' \n' | head -c 500; echo
          cp /tmp/p.html /tmp/share.html
          for u in "https://www.debit.com.br/indicadores-economicos" "https://www.debit.com.br/"; do
            g "$u"
            sed 's/<title>/\nTITLE: /;s/<\/title>/\n/' /tmp/p.html | grep -m1 "^TITLE" 
            grep -oiE "href=\"[^\"]*(indicador|selic|cdi|ipca|igp|taxa|juros|dolar|euro|di-|futuro|curva|tabela)[^\"]*\"" /tmp/p.html | sort -u | head -60
          done
