name: Checagem temporária de fontes (B3)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Curva DI na B3 (sistemaswebb3-derivativos)
        run: |
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36'
          H=https://sistemaswebb3-derivativos.b3.com.br
          curl -sSL -m 40 -A "$UA" -o /tmp/p.html -w "page -> %{http_code} %{size_download}B\n" "$H/referenceRatesPage/all?language=pt-br"
          grep -oE "(src|href)=\"[^\"]+\.js\"" /tmp/p.html | head
          for js in $(grep -oE "(src)=\"[^\"]+\.js\"" /tmp/p.html | sed 's/src="//;s/"$//'); do
            case "$js" in http*) U="$js";; /*) U="$H$js";; *) U="$H/referenceRatesPage/$js";; esac
            curl -sSL -m 40 -A "$UA" -o /tmp/s.js -w "$U -> %{http_code} %{size_download}B\n" "$U"
            grep -oE "[\"'\`][^\"'\`]*(referenceRates|ReferenceRates|Proxy)[^\"'\`]*[\"'\`]" /tmp/s.js | sort -u | head -30
          done
          for u in "$H/referenceRatesProxy/ReferenceRates/GetReferenceRates" "$H/referenceRatesProxy/ReferenceRates/GetTypeRates"; do
            curl -sSL -m 30 -A "$UA" -o /tmp/d.out -w "$u -> %{http_code} %{content_type}\n" "$u"; head -c 400 /tmp/d.out; echo
          done
