name: Checagem temporária de fontes (Investing)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: SOFR futures no Investing.com
        run: |
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36'
          g() { echo; echo "=== $1"; curl -sSL -m 40 -A "$UA" -H 'Accept-Language: en-US,en;q=0.9' -o /tmp/p.html -w "-> %{http_code} %{content_type} %{size_download}B\n" "$1"; }
          g "https://www.investing.com/rates-bonds/three-month-sofr-futures"
          sed 's/<[^>]*>/ /g' /tmp/p.html | tr -s ' \n' | head -c 600; echo
          grep -oiE "(sofr[a-z0-9-]*c[0-9]|SR3[A-Z][0-9]{2}|[A-Z][a-z]{2} '?[0-9]{2}[^<]{0,20}SOFR)" /tmp/p.html | sort -u | head -20
          grep -oE "(pairId|pair_id|\"id\":[0-9]{5,8})[^,]{0,30}" /tmp/p.html | head -5
          g "https://www.investing.com/rates-bonds/three-month-sofr-futures-historical-data"
          sed 's/<[^>]*>/ /g' /tmp/p.html | tr -s ' \n' | grep -iE "Oct 0|Oct 1|Price|Open" | head -8
          g "https://api.investing.com/api/financialdata/historical/1073569?start-date=2026-09-01&end-date=2026-10-09&time-frame=Daily&add-missing-rows=false"
          head -c 300 /tmp/p.html; echo
