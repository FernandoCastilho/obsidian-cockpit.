name: Checagem temporária de fontes (SOFR futuros)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Futuros de SOFR (Yahoo, com intervalo)
        run: |
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36'
          t() { echo "== $1"; curl -sSL -m 30 -A "$UA" -w "\n-> %{http_code} %{size_download}B\n" "$1" | head -c "${2:-420}"; echo; sleep 4; }
          t "https://query2.finance.yahoo.com/v1/finance/search?q=SR3&quotesCount=15&newsCount=0" 1500
          for s in SR3Z26.CME SR3H27.CME SR3M27.CME SR3Z27.CME SR3Z28.CME; do
            t "https://query2.finance.yahoo.com/v8/finance/chart/$s?interval=1d&range=5d" 450
          done
          t "https://query2.finance.yahoo.com/v7/finance/quote?symbols=SR3Z26.CME,SR3H27.CME,SR3Z27.CME" 600
