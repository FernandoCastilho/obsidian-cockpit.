name: Checagem temporária de fontes (B3)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Curva DI na B3 (rotas da API)
        run: |
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36'
          H=https://sistemaswebb3-derivativos.b3.com.br
          curl -sSL -m 60 -A "$UA" -o /tmp/m.js "$H/referenceRatesPage/main-SNKCZLWW.js"
          echo "== rotas"
          grep -oE "[A-Za-z]*[Rr]eferenceRates[A-Za-z/]*" /tmp/m.js | sort | uniq -c | head -30
          echo "== contexto"
          grep -oE ".{250}referenceRatesProxy/.{500}" /tmp/m.js | head -3
          grep -oE ".{200}ReferenceRatesDiIPCA_.{200}" /tmp/m.js | head -2
          grep -oE "(get|post)\([^)]{0,160}(Rates|rates)[^)]{0,100}\)" /tmp/m.js | head -20
