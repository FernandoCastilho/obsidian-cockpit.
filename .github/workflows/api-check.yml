name: Checagem temporária de fontes (B3)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Endereços de dados nas páginas da B3
        continue-on-error: true
        run: |
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36'
          fetch() { curl -sSL -m 40 -A "$UA" -o "$2" -w "$1 -> %{http_code} %{content_type} %{size_download}B\n" "$1" || echo "$1 -> falhou"; }
          fetch "https://www.b3.com.br/pt_br/market-data-e-indices/servicos-de-dados/market-data/consultas/mercado-de-derivativos/precos-referenciais/taxas-referenciais-bm-fbovespa/" /tmp/a.html
          fetch "https://www.b3.com.br/pt_br/market-data-e-indices/servicos-de-dados/market-data/consultas/mercado-de-derivativos/precos-de-ajuste/" /tmp/b.html
          fetch "https://www2.bmf.com.br/pages/portal/bmfbovespa/lumis/lum-ajustes-do-pregao-ptBR.asp" /tmp/c.html
          for f in a b c; do
            echo "== links de dados em $f.html"
            grep -oiE "(https?:)?//[a-z0-9./_?=&%:-]*(arquivos|download|api|\.csv|\.json|\.zip|\.txt|\.asp|\.xls|tabelas|taxa|ajuste)[a-z0-9./_?=&%:-]*" /tmp/$f.html | sort -u | head -40
            echo "-- iframes/forms"
            grep -oiE "<(iframe|form)[^>]*(src|action)=[\"'][^\"']+" /tmp/$f.html | head -10
          done
          echo "== candidatos diretos"
          for u in \
            "https://www2.bmf.com.br/pages/portal/bmfbovespa/lumis/lum-taxas-referenciais-bmf-ptBR.asp" \
            "https://arquivos.b3.com.br/api/channels" \
            "https://arquivos.b3.com.br/tabelas/TaxaReferencial" \
            "https://arquivos.b3.com.br/tabelas/AjustePregao" ; do
            fetch "$u" /tmp/d.out; head -c 300 /tmp/d.out | tr -c '[:print:]\n' '?' | tr '\n' ' '; echo
          done
