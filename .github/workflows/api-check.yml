name: Checagem temporária da API de cotações

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Testar APIs do Banco Central (CDI, Selic, Focus) e CORS
        continue-on-error: true
        run: |
          show() {
            echo "== $1"
            for i in 1 2 3; do
              code=$(curl -sS -m 25 -H 'Origin: https://fernandocastilho.github.io' -D /tmp/h.txt -o /tmp/r.json -w '%{http_code}' "$1" || echo 000)
              echo "tentativa $i: HTTP $code"
              [ "$code" = "200" ] && break
              sleep 3
            done
            grep -i 'access-control-allow-origin' /tmp/h.txt || echo "(sem cabeçalho CORS)"
            head -c 350 /tmp/r.json | tr '\n' ' '; echo
            jq -r 'if type=="array" then "itens: \(length)" else "chaves: \(keys|join(","))" end' /tmp/r.json 2>/dev/null || true
          }
          show "https://api.bcb.gov.br/dados/serie/bcdata.sgs.12/dados/ultimos/3?formato=json"
          show "https://api.bcb.gov.br/dados/serie/bcdata.sgs.4389/dados/ultimos/3?formato=json"
          show "https://api.bcb.gov.br/dados/serie/bcdata.sgs.432/dados?formato=json&dataInicial=01/01/2024&dataFinal=31/12/2025"
          show "https://api.bcb.gov.br/dados/serie/bcdata.sgs.432/dados?formato=json&dataInicial=01/01/1999&dataFinal=31/12/2008"
          show "https://olinda.bcb.gov.br/olinda/servico/Expectativas/versao/v1/odata/ExpectativasMercadoAnuais?\$top=6&\$filter=Indicador%20eq%20'Selic'&\$orderby=Data%20desc&\$format=json"
          show "https://olinda.bcb.gov.br/olinda/servico/Expectativas/versao/v1/odata/ExpectativasMercadoAnuais?\$top=3000&\$orderby=Data%20desc&\$select=Indicador&\$format=json"
          jq -r '[.value[].Indicador]|unique|join(" | ")' /tmp/r.json 2>/dev/null || true
