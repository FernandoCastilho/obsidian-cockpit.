<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Revisão responsiva de sugestões</title><style>body{font:15px system-ui;background:#ddd;margin:12px}button{padding:10px;margin:4px}iframe{display:block;height:760px;border:1px solid #888;background:white;max-width:100%}</style></head><body><nav aria-label="Ensaio"><button data-width="320">320 px</button><button data-width="390">390 px</button><button data-width="768">768 px</button><button data-width="1100">1100 px</button><button id="theme">Alternar tema</button></nav><p>Ensaio de largura. Não emula dispositivo físico.</p><iframe title="Prévia real da caixa de sugestões" src="./feedback-preview.html?theme=dark" width="390"></iframe><script>const frame=document.querySelector('iframe');document.querySelectorAll('[data-width]').forEach(button=>button.onclick=()=>frame.width=button.dataset.width);document.querySelector('#theme').onclick=()=>{const doc=frame.contentDocument;doc.documentElement.dataset.theme=doc.documentElement.dataset.theme==='light'?'dark':'light'}</script></body></html>
