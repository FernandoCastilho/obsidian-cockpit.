<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ensaio responsivo das pastas</title><style>body{margin:12px;background:#ddd;font:14px system-ui}nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}button{min-height:44px}iframe{display:block;width:390px;height:calc(100vh - 90px);border:1px solid #777;background:#fff}</style><nav aria-label="Largura do ensaio"><button data-width="320">320 px</button><button data-width="390">390 px</button><button data-width="768">768 px</button><button data-width="1024">1024 px</button><button data-width="1440">1440 px</button><button data-route="setores/central">Pastas</button><button data-route="setores/pasta/base-florestal">Subsetores</button><button data-route="setores/topico/base-florestal/3">Estudo</button></nav><iframe title="Painel responsivo" src="../../#setores/central"></iframe><script>for(const button of document.querySelectorAll('[data-width]'))button.addEventListener('click',()=>document.querySelector('iframe').style.width=`${button.dataset.width}px`);for(const button of document.querySelectorAll('[data-route]'))button.addEventListener('click',()=>document.querySelector('iframe').src=`../../#${button.dataset.route}`)</script></html>
